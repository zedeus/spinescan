# Scoring thresholds — single source of truth.
# All values referenced by core; no magic numbers in code.

# Green: high confidence, correct match
green.score=0.85
green.lead=0.10
green.frames=2
green.single=0.95
green.confidentLead=0.15
green.confidentMinScore=0.80
green.confidentMinPopularity=30000
green.minTextLength=4
green.shortTextMinPopularity=1000

# Orange: likely match or disagreeing frames
orange.floor=0.45

# Red: below orange floor or no text

# API client
api.batch.ms=300
api.retry.ms=5000
api.timeout.ms=10000
